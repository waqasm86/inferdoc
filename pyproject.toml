[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inferdoc"
version = "0.1.0"
description = "Evidence-driven LLM inference doctor for Nebius Token Factory"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Mohammad Waqas"}]
keywords = ["llm", "inference", "benchmarking", "nebius", "nemotron", "nvidia"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.27", "pydantic>=2.7", "python-dotenv>=1.0"]

[project.optional-dependencies]
nebius = ["openai>=1.40"]
dev = ["build>=1.2", "pytest>=8", "twine>=5.1"]

[project.urls]
Homepage = "https://github.com/waqasm86/inferdoc"
Repository = "https://github.com/waqasm86/inferdoc"
Issues = "https://github.com/waqasm86/inferdoc/issues"

[project.scripts]
inferdoc = "inferdoc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: explicit live Token Factory calls; requires INFERDOC_RUN_LIVE_TESTS=1"]
